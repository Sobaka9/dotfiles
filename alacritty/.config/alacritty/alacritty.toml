[general]
# Colours are theme-managed: colors.toml is generated by the theme
# switcher (~/.config/themes/apply-theme.sh).
import = ["~/.config/alacritty/colors.toml"]

[window]
opacity = 0.4
title = "Terminal"
[window.padding]
  x = 4
  y = 4

[font]
  size = 14

[font.normal]
  family = "JetBrains Mono Nerd Font"
  style = "Regular"

[font.bold]
  family = "JetBrains Mono Nerd Font"
  style = "Bold"

[font.italic]
  family = "JetBrains Mono Nerd Font"
  style = "Italic"

[font.bold_italic]
  family = "JetBrains Mono Nerd Font"
  style = "Bold Italic"

[terminal.shell]
  program = "/usr/bin/fish"
  # -C runs after config.fish, only for shells alacritty starts itself
  args = ["-C", "nitch"]

[cursor]
  # never stop blinking, so the caret always looks like it wants input
  blink_interval = 500
  blink_timeout = 0

[cursor.style]
  shape = "Beam"
  blinking = "Always"

