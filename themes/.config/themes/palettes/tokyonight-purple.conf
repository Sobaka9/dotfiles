# =============================================================
#  Tokyonight Purple  —  baseline palette (your current look)
#  Applying this theme is a visual no-op; it captures exactly
#  what your rice looks like today. Copy this file to add a
#  new theme, then change the values.
# =============================================================

THEME_NAME="Tokyonight Purple"
# Thumbnail shown in the wofi picker (wallpaper-engine workshop preview).
preview="$HOME/Backgrounds/2837310594/preview.jpg"

# ---- core surfaces ----
bg="#0a0a0a"        # bars, terminal, wofi background
bg_alt="#171717"    # wofi input field
surface="#262626"   # hover / selected
muted="#2e2e2e"     # inactive workspace text
fg="#ffffff"        # primary foreground
fg_dim="#cdd6f4"    # dim foreground

# ---- accent ----
accent="#9537e8"    # active workspace, highlights

# ---- semantic colours (waybar modules) ----
red="#f43f5e"
green="#a6e3a1"
yellow="#eab308"
blue="#3b82f6"
teal="#14b8a6"
sky="#0ea5e9"
magenta="#d946ef"

# ---- hyprland window borders (rgba hex incl. alpha, no '#') ----
border_active1="7b2cbfee"
border_active2="5a189aee"
border_inactive="262626ee"
border_angle="45deg"

# ---- mako notification daemon ----
mako_bg="#1e1e2e"
mako_fg="#cdd6f4"
mako_border="#cba6f7"     # global border
mako_progress="#89b4fa"
mako_low="#cba6f7"        # urgency=low border
mako_normal="#9537e8"     # urgency=normal border (accent)
mako_high="#f43f5e"       # urgency=high border
mako_high_text="#f38ba8"  # urgency=high text
mako_cat="#f9e2af"        # category=mpd border

# ---- terminal (alacritty) palette ----
term_bg="#0a0a0a"
term_fg="#cdd6f4"
t_black="#45475a";  t_red="#ef688e";    t_green="#8ada83";  t_yellow="#f6d488"
t_blue="#649cf8";   t_magenta="#ef9cd8"; t_cyan="#57c1ff";  t_white="#e4e4e7"
b_black="#585b70";  b_red="#f38ba8";    b_green="#a6e3a1";  b_yellow="#f9e2af"
b_blue="#89b4fa";   b_magenta="#f5c2e7"; b_cyan="#7dcfff";  b_white="#f4f4f5"

# ---- GTK / QT (QT follows GTK via QT_QPA_PLATFORMTHEME=gtk3) ----
gtk_theme="Tokyonight-Purple-Dark-Compact-Moon"
gtk_color_scheme="prefer-dark"

# ---- Papirus folder colour (run `papirus-folders -l` for the full list) ----
folder_color="violet"

# ---- wallpaper engine ----
# we_primary   -> DP-3 (right / primary monitor)
# we_secondary -> DP-2 (left  / secondary monitor)
# Workshop IDs: 2600287972 RAIN PARK | 2582147561 EVENING SHINJUKU
#               2837310594 SEA OF STARS | 2892621110 CAT PLANET
we_primary="$HOME/Backgrounds/2837310594/"
we_secondary="$HOME/Backgrounds/2892621110/"
we_nopause="false"

# ---- quickshell bar fonts ----
# Swap qs_font to "Rubik" for the Caelestia look (needs ttf-rubik-vf).
qs_font="Jetbrains Mono NerdFont"
qs_font_mono="Jetbrains Mono NerdFont"
