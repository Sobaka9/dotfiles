# =============================================================
#  Rain Park  —  misty rainy Shinjuku park (Garden of Words)
#  Lush greens + cool grey-blue rain haze, amber window lights,
#  azalea-pink accents.
# =============================================================

THEME_NAME="Nature"
preview="$HOME/Backgrounds/1281803757/preview.jpg"

# ---- core surfaces (dark, cool, green-tinted mist) ----
bg="#0e1413"        # bars, terminal, wofi background
bg_alt="#161d1c"    # wofi input field
surface="#232c2a"   # hover / selected
muted="#3a4845"     # inactive workspace text
fg="#e8efe9"        # primary foreground (misty off-white)
fg_dim="#b8c6c0"    # dim foreground

# ---- accent (fresh foliage green) ----
accent="#7fae5a"

# ---- semantic colours (waybar modules) ----
red="#f43f5e"
green="#a6e3a1"
yellow="#eab308"
blue="#3b82f6"
teal="#14b8a6"
sky="#0ea5e9"
magenta="#d946ef"

# ---- hyprland window borders (rgba hex incl. alpha, no '#') ----
border_active1="7fae5aee"   # green
border_active2="5f9e93ee"   # teal
border_inactive="232c2aee"
border_angle="45deg"

# ---- mako notification daemon ----
mako_bg="#101817"
mako_fg="#e8efe9"
mako_border="#7fae5a"     # global border
mako_progress="#6f97b3"
mako_low="#5f9e93"        # urgency=low border
mako_normal="#7fae5a"     # urgency=normal border (accent)
mako_high="#c96f6f"       # urgency=high border
mako_high_text="#c96f6f"  # urgency=high text
mako_cat="#d9b86a"        # category=mpd border

# ---- terminal (alacritty) palette ----
term_bg="#0e1413"
term_fg="#cdd6cf"
t_black="#2a3331";  t_red="#b56a6a";    t_green="#7fae5a";  t_yellow="#c9a85f"
t_blue="#6f97b3";   t_magenta="#b07f9c"; t_cyan="#5f9e93";  t_white="#c4ccc6"
b_black="#45524e";  b_red="#c98080";    b_green="#93c06d";  b_yellow="#d9b86a"
b_blue="#88b4c9";   b_magenta="#c98aa6"; b_cyan="#76b3a7";  b_white="#e8efe9"

# ---- GTK / QT (QT follows GTK via QT_QPA_PLATFORMTHEME=gtk3) ----
gtk_theme="Tokyonight-Dark-Moon"
gtk_color_scheme="prefer-dark"

# ---- Papirus folder colour (run `papirus-folders -l` for the full list) ----
folder_color="green"

# ---- wallpaper engine ----
# we_primary   -> DP-3 (right / primary monitor)
# we_secondary -> DP-2 (left  / secondary monitor)
# Workshop IDs: 2600287972 RAIN PARK | 2582147561 EVENING SHINJUKU
#               2837310594 SEA OF STARS | 2892621110 CAT PLANET
# Both monitors show Rain Park for colour cohesion; change we_secondary
# to ~/Backgrounds/2582147561/ (Evening Shinjuku) for a park+city pairing.
we_primary="$HOME/Backgrounds/1281803757/"
we_secondary="$HOME/Backgrounds/1435611874/"
we_nopause="false"

# ---- quickshell bar fonts ----
# Swap qs_font to "Rubik" for the Caelestia look (needs ttf-rubik-vf).
qs_font="Jetbrains Mono NerdFont"
qs_font_mono="Jetbrains Mono NerdFont"
